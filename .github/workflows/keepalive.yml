name: Keep backend and database warm

on:
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          BACKEND_KEEPALIVE_URL: ${{ secrets.BACKEND_KEEPALIVE_URL }}
        run: |
          if [ -z "$BACKEND_KEEPALIVE_URL" ]; then
            echo "BACKEND_KEEPALIVE_URL secret is not configured"
            exit 1
          fi

          url="${BACKEND_KEEPALIVE_URL%/}/health/db"
          echo "Calling $url"
          curl --fail --silent --show-error --retry 3 --retry-delay 5 "$url"
